[package]
name = "lightfox"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "An experimental lightweight browser shell targeting the Servo engine"
license = "MPL-2.0"
repository = "https://github.com/maksimkramsaev58-prog/waterfox"
homepage = "https://maksimkramsaev58-prog.github.io/waterfox/"
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"